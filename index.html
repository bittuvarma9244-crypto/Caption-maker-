<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d28d9"><title>Caption Maker</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ff;color:#211638;font-family:system-ui,Arial}.wrap{max-width:520px;margin:auto}.hero{padding:28px 20px 30px;color:white;background:linear-gradient(135deg,#6d28d9,#c026d3);border-radius:0 0 26px 26px}.tag{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.85}.hero h1{font-size:30px;margin:8px 0}.hero p{margin:0;opacity:.9}.card{background:white;margin:16px;padding:18px;border-radius:18px;box-shadow:0 5px 22px #35166c0d}.field{display:block;font-weight:750;font-size:14px;margin:12px 0 6px}select,input{width:100%;padding:13px;border:1px solid #e2d8f5;border-radius:11px;font:inherit;background:white}button{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:16px;color:white;background:#7c3aed}.out{white-space:pre-wrap;background:#f7f2ff;padding:14px;border-radius:12px;margin-top:14px;line-height:1.6;min-height:75px}.copy{background:#eee7ff;color:#5421a8;width:100%;margin-top:10px}.muted{color:#746a83;font-size:13px}.foot{text-align:center;color:#81768d;font-size:12px;padding:12px 24px 28px}
</style></head><body><div class="wrap"><header class="hero"><div class="tag">CREATE • CAPTION • SHARE</div><h1>Caption Maker ✨</h1><p>आपकी Reel के लिए कैप्शन और हैशटैग।</p></header><section class="card"><h2 style="margin:0">कैप्शन बनाएँ</h2><p class="muted">कैटेगरी चुनें और अपनी पोस्ट का विषय लिखें।</p><label class="field">कैटेगरी</label><select id="category"><option value="reels">Instagram Reels</option><option value="youtube">YouTube Shorts</option><option value="gaming">Gaming</option><option value="comedy">Comedy</option><option value="nature">Nature</option><option value="bike">Bike / Ride</option></select><label class="field">भाषा</label><select id="language"><option value="hi">हिंदी</option><option value="en">English</option><option value="mix">Hinglish</option></select><label class="field">वीडियो का विषय</label><input id="topic" placeholder="जैसे: बारिश में बाइक राइड"><button class="primary" id="make">कैप्शन बनाएँ</button><div id="output" class="out">आपका कैप्शन यहाँ दिखेगा।</div><button class="copy" id="copy">कैप्शन कॉपी करें</button><p class="muted" id="status" aria-live="polite"></p></section><div class="foot">Caption Maker • शुरुआती प्रोटोटाइप</div></div>
<script>const templates={hi:{reels:'✨ {t} का अपना ही मज़ा है! पसंद आए तो ❤️ ज़रूर करें।\\n#Reels #Trending #Viral',youtube:'🔥 आज का वीडियो: {t}\\nऐसे ही वीडियो के लिए चैनल सब्सक्राइब करें!\\n#Shorts #YouTubeShorts',gaming:'🎮 {t} — गेम ऑन, टेंशन ऑफ!\\n#Gaming #Gamer #Gameplay',comedy:'😂 {t} देखकर हँसी रोक पाओ तो बताना!\\n#Comedy #Funny # मजेदार',nature:'🌿 {t} और सुकून भरे पल।\\n#Nature #Beautiful #Peace',bike:'🏍️ {t} — रास्ते अपने, सफर अपना!\\n#BikeRide #RideLife #Travel'},en:{reels:'✨ The vibe of {t} is unmatched! Like if you feel it.\\n#Reels #Trending #Vibes',youtube:'🔥 Today: {t}\\nSubscribe for more quick videos!\\n#Shorts #YouTubeShorts',gaming:'🎮 {t} — game on, worries off!\\n#Gaming #Gamer #Gameplay',comedy:'😂 Try not to laugh at {t}!\\n#Comedy #Funny #LOL',nature:'🌿 Finding peace in {t}.\\n#Nature #Beautiful #Peace',bike:'🏍️ {t} — new roads, new memories.\\n#BikeRide #RideLife #Travel'},mix:{reels:'✨ {t} ka vibe hi alag hai! Pasand aaye to ❤️ karo.\\n#Reels #Trending #Viral',youtube:'🔥 Aaj ka video: {t}\\nMore shorts ke liye subscribe karo!\\n#Shorts #YouTubeShorts',gaming:'🎮 {t} — game on, tension gone!\\n#Gaming #Gamer #Gameplay',comedy:'😂 {t} dekh ke hasi control kar pao to batao!\\n#Comedy #Funny #LOL',nature:'🌿 {t} aur peaceful vibes.\\n#Nature #Beautiful #Peace',bike:'🏍️ {t} — ride apni, style apna!\\n#BikeRide #RideLife #Travel'}};document.getElementById('make').onclick=()=>{let t=document.getElementById('topic').value.trim()||'मेरी नई पोस्ट';let l=document.getElementById('language').value,c=document.getElementById('category').value;document.getElementById('output').textContent=templates[l][c].replaceAll('{t}',t);document.getElementById('status').textContent='कैप्शन तैयार है।';};document.getElementById('copy').onclick=async()=>{let s=document.getElementById('output').textContent;try{await navigator.clipboard.writeText(s);document.getElementById('status').textContent='कॉपी हो गया!';}catch(e){document.getElementById('status').textContent='टेक्स्ट चुनकर कॉपी करें: आउटपुट पर देर तक दबाएँ।';}};</script></body></html>
